<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:wght,MONO@300..800,1&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=block">
<style>
  html,body{margin:0;background:#000}
  .post{width:1080px;height:1350px;box-sizing:border-box;padding:64px;background:#000;color:#fff;
    display:grid;grid-template-rows:auto 1fr auto;position:relative;overflow:hidden}
  .mono{font-family:'Recursive',monospace;font-variation-settings:"MONO" 1;font-weight:400;
    font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .top{display:flex;justify-content:space-between;align-items:baseline}
  .sig{font-family:'Roboto Flex';font-size:44px;line-height:1;color:#fff;letter-spacing:0}
  .sig span,.title span{display:inline-block}
  .title{align-self:end;font-family:'Roboto Flex';line-height:.8;white-space:nowrap;
    letter-spacing:-.01em;margin-left:-.04em;transform-origin:left bottom}
  .rule{height:1px;background:rgba(255,255,255,.35);margin:40px 0 28px}
  .bottom{display:flex;justify-content:space-between}
</style></head>
<body>
<div class="post" id="post">
  <div class="top"><span class="mono" id="num"></span><span class="sig" id="sig"></span></div>
  <div class="title"><span id="title" style="display:inline-block"></span></div>
  <div><div class="rule"></div>
  <div class="bottom mono"><span>@l20n.archive</span><span id="foot"></span></div></div>
</div>
<script>
function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);return h1>>>0;}
function prng(seed){return()=>{seed=(seed+0x6d2b79f5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function data(seed,n){const r=prng(hash(String(seed)));return Array.from({length:n},()=>r());}
// Misma regla que la firma: una letra fina (la de dato más bajo), el resto pesa y se ensancha según el dato.
function letters(word,seed,thinW){
  const L=[...word], d=data(seed,L.length*2), first=d.slice(0,L.length);
  const thin=first.indexOf(Math.min(...first.filter((_,i)=>L[i]!==' ')));
  return L.map((ch,i)=>{const s=document.createElement('span');s.textContent=ch===' '?' ':ch;
    const w=i===thin?thinW:500+d[i]*500, wd=40+d[i+L.length]*111;
    s.style.fontVariationSettings=`"wght" ${Math.round(w)}, "wdth" ${Math.round(wd)}, "opsz" 144`;return s;});
}
const q=new URLSearchParams(location.search), word=q.get('t')||'intro', seed=q.get('s')||word;
document.getElementById('num').textContent=q.get('n')||'#001';
document.getElementById('foot').textContent=q.get('f')||'';
letters('L20N',seed,180).forEach(s=>document.getElementById('sig').append(s));
const t=document.getElementById('title');letters(word,seed,120).forEach(s=>t.append(s));
document.fonts.ready.then(()=>{t.style.fontSize='100px';const k=(1080-128)/t.getBoundingClientRect().width;
  const fs=Math.min(100*k,640);t.style.fontSize=fs+'px';if(/[gjpqy]/.test(word))t.parentNode.style.marginBottom=(fs*.2)+'px';document.title='ready';});
</script></body></html>
