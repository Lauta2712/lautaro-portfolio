  <!-- <LR/> text -->
  <text font-family="'IBM Plex Mono','JetBrains Mono',monospace" font-size="8.5" font-weight="700" y="20.5">
    <tspan x="2.5" fill="#ff6a3d">&lt;</tspan><tspan fill="#f2f2f4">LR</tspan><tspan fill="#ff6a3d">/&gt;</tspan>
  </text>
